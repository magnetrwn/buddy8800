# Fixed ALTMON regression machine; independent of the distributable defaults.
[emulator]
pseudo_bdos_enabled = false
start_with_pc_at = 0xF800

[[card]]
slot = 0
type = "rom"
at = 0xF800
range = 1031
load = "f800mon.bin"

[[card]]
slot = 10
type = "serial"
at = 0x10

[[card]]
slot = 17
type = "ram"
at = 0x0000
range = 65536
let_collide = true
